#Aplicacao
spring.application.name=golden-raspberry-api
spring.threads.virtual.enabled=true

#Arquivo de filmes (classpath:... ou file:...)
filme.arquivo-csv=${FILME_ARQUIVO_CSV:classpath:Movielist.csv}

#Database - H2 embarcado em memoria. Sem spring.datasource.url de proposito: o Boot gera um nome
#unico por contexto (isola os testes) e executa o schema.sql por ser banco embarcado

#JPA/Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

#Servidor
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never
server.error.include-message=never
